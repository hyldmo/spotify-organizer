name: Deploy to Production
'on':
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'yarn'

      - name: Install dependencies
        run: yarn --immutable

      - name: Lint Typescript
        run: yarn lint

      - name: Lint CSS
        run: yarn stylelint

      - name: Typecheck Worker
        run: yarn workspace spotify-organiser-workers typecheck

      - name: Test Worker
        run: yarn workspace spotify-organiser-workers test

      - name: Get version number
        id: semver
        run: ./scripts/semver.sh

      # - name: Run unit tests
      #   run: yarn test:cover

      # - name: Upload code coverage
      #   uses: coverallsapp/github-action@master
      #   with:
      #     github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build application
        run: yarn prod
        env:
          PACKAGE_VERSION: '${{ steps.semver.outputs.VERSION }}'

      # The Cloudflare token only reaches the next two steps, not the install scripts above.
      - name: Apply D1 migrations
        run: yarn workspace spotify-organiser-workers db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: yarn workspace spotify-organiser-workers deploy --branch master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: yarn release
        if: ${{ steps.semver.outputs.VERSION != '' }}
