name: Preview
'on': pull_request
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'yarn'

      - name: Install dependencies
        run: yarn --immutable

      - name: Lint Typescript
        run: yarn lint

      - name: Lint CSS
        run: yarn stylelint

      - name: Typecheck Worker
        run: yarn workspace spotify-organiser-workers typecheck

      - name: Test Worker
        run: yarn workspace spotify-organiser-workers test

      # - name: Run unit tests
      #   run: yarn test:cover

      # - name: Upload code coverage
      #   uses: coverallsapp/github-action@master
      #   with:
      #     github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build application
        run: yarn prod
        env:
          PACKAGE_VERSION: '-beta'

      # Previews use the PR number, never the branch name, inside the shell command.
      - name: Deploy preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set, so no preview was deployed."
            exit 0
          fi
          OUT=$(yarn workspace spotify-organiser-workers deploy --branch "$PREVIEW_BRANCH" 2>&1)
          echo "$OUT"
          echo "url=https://$PREVIEW_BRANCH.spotify-organiser.pages.dev" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: steps.deploy.outputs.url != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            Preview deployed: ${{ steps.deploy.outputs.url }}
            Spotify sign-in only works on https://spotify-organiser.pages.dev, because Spotify needs every redirect URI listed in advance.
